# Personalized Academic Pages configuration for Junteng Liu.
# Profile values are limited to the connected memory.

locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Junteng Liu is a first-year PhD candidate at the HKUST NLP Group researching natural language processing and machine learning."
url: "https://weldantimplode12.github.io"
baseurl: "/LJT-Homepage"
repository: "WeldAntImplode12/LJT-Homepage"

# Sidebar profile
author:
  avatar: "https://avatars.githubusercontent.com/u/77915985?v=4"
  name: "Junteng Liu"
